<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="application-name" content="Phrase Speaker">
<meta name="description" content="Travel phrases in Arabic, French and Spanish with big tap-to-speak display. Glanceable on Meta Ray-Ban Display.">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Phrase Speaker</title>
<style>
:root{--accent:#38BDF8;--bg:#0B0F14;--card:#161C26;--line:#2A3442;--text:#F3F6FA;--dim:#9AA6B6;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;min-height:100dvh;background:#000;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{width:min(480px,100vw - 24px);height:100dvh;max-height:780px;display:flex;flex-direction:column;padding:16px 14px 12px;background:var(--bg);border-radius:18px;gap:10px}
h1{font-size:20px;text-align:center}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs button{min-height:48px;font-size:16px;color:var(--dim)}
.tabs button.active{background:var(--accent);border-color:var(--accent);color:#101418;font-weight:700}
button{min-height:48px;font-size:16px;font-family:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:active{transform:scale(.98)}
.display{min-height:128px;background:var(--card);border:2px solid var(--accent);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;gap:4px;text-align:center}
.display .big{font-size:34px;font-weight:700;line-height:1.2}
.display .gloss{font-size:14px;color:var(--dim)}
.scroll{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.phrase{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 12px;text-align:left;width:100%}
.phrase .t{font-size:19px;font-weight:600}
.phrase .e{font-size:13px;color:var(--dim)}
.phrase.picked{border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <h1>&#x1F50A; Phrase Speaker</h1>
  <div class="tabs" id="tabs"></div>
  <div class="display" id="display">
    <div class="big" id="dispBig" dir="auto">Tap a phrase</div>
    <div class="gloss" id="dispGloss"></div>
  </div>
  <div class="scroll" id="list"></div>
</div>
<script>
(function(){
"use strict";
var LANGS=[
 {id:"ar",label:"Arabic",speech:"ar-SA"},
 {id:"fr",label:"French",speech:"fr-FR"},
 {id:"es",label:"Spanish",speech:"es-ES"}
];
var PHRASES={
 ar:[
  {en:"Hello",text:"\u0645\u0631\u062D\u0628\u0627"},
  {en:"Thank you",text:"\u0634\u0643\u0631\u0627"},
  {en:"Please",text:"\u0645\u0646 \u0641\u0636\u0644\u0643"},
  {en:"Where is\u2026?",text:"\u0623\u064A\u0646\u2026\u061F"},
  {en:"How much?",text:"\u0628\u0643\u0645\u061F"},
  {en:"Help!",text:"\u0627\u0644\u0646\u062C\u062F\u0629!"},
  {en:"Do you speak English?",text:"\u0647\u0644 \u062A\u062A\u0643\u0644\u0645 \u0627\u0644\u0625\u0646\u062C\u0644\u064A\u0632\u064A\u0629\u061F"},
  {en:"The check, please",text:"\u0627\u0644\u062D\u0633\u0627\u0628 \u0645\u0646 \u0641\u0636\u0644\u0643"}],
 fr:[
  {en:"Hello",text:"Bonjour"},
  {en:"Thank you",text:"Merci"},
  {en:"Please",text:"S\u2019il vous pla\u00EEt"},
  {en:"Where is\u2026?",text:"O\u00F9 est\u2026?"},
  {en:"How much?",text:"Combien \u00E7a co\u00FBte?"},
  {en:"Help!",text:"Au secours!"},
  {en:"Do you speak English?",text:"Parlez-vous anglais?"},
  {en:"The check, please",text:"L\u2019addition, s\u2019il vous pla\u00EEt"}],
 es:[
  {en:"Hello",text:"Hola"},
  {en:"Thank you",text:"Gracias"},
  {en:"Please",text:"Por favor"},
  {en:"Where is\u2026?",text:"\u00BFD\u00F3nde est\u00E1\u2026?"},
  {en:"How much?",text:"\u00BFCu\u00E1nto cuesta?"},
  {en:"Help!",text:"\u00A1Ayuda!"},
  {en:"Do you speak English?",text:"\u00BFHabla ingl\u00E9s?"},
  {en:"The check, please",text:"La cuenta, por favor"}]
};
var langIdx=0;
var picked=-1;
var tabsEl=document.getElementById("tabs");
var listEl=document.getElementById("list");
var dispBig=document.getElementById("dispBig");
var dispGloss=document.getElementById("dispGloss");
var focusables=[];
var focusPos=0;

function currentLang(){ return LANGS[langIdx]; }

function speak(text,langCode){
  try{
    if(!("speechSynthesis" in window)) return;
    var u=new SpeechSynthesisUtterance(text);
    u.lang=langCode;
    var vs=window.speechSynthesis.getVoices();
    var prefix=langCode.slice(0,2).toLowerCase();
    for(var i=0;i<vs.length;i++){
      if(vs[i].lang && vs[i].lang.toLowerCase().indexOf(prefix)===0){ u.voice=vs[i]; break; }
    }
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function renderTabs(){
  tabsEl.innerHTML="";
  LANGS.forEach(function(l,i){
    var b=document.createElement("button");
    b.textContent=l.label;
    b.setAttribute("data-focusable","");
    if(i===langIdx) b.classList.add("active");
    b.addEventListener("click",function(){ setLang(i); });
    b.addEventListener("focus",function(){ if(langIdx!==i) setLang(i); });
    tabsEl.appendChild(b);
  });
}
function renderList(){
  listEl.innerHTML="";
  PHRASES[currentLang().id].forEach(function(p,i){
    var b=document.createElement("button");
    b.className="phrase"+(i===picked?" picked":"");
    b.setAttribute("data-focusable","");
    var t=document.createElement("div"); t.className="t"; t.setAttribute("dir","auto"); t.textContent=p.text;
    var e=document.createElement("div"); e.className="e"; e.textContent=p.en;
    b.appendChild(t); b.appendChild(e);
    b.addEventListener("click",function(){ pick(i); });
    listEl.appendChild(b);
  });
}
function refreshFocusables(){
  focusables=Array.prototype.slice.call(document.querySelectorAll("[data-focusable]"));
}
function setLang(i){
  langIdx=Math.max(0,Math.min(LANGS.length-1,i));
  picked=-1;
  dispBig.textContent="Tap a phrase";
  dispGloss.textContent="";
  renderTabs(); renderList(); refreshFocusables();
}
function pick(i){
  var p=PHRASES[currentLang().id][i];
  if(!p) return;
  picked=i;
  dispBig.textContent=p.text;
  dispGloss.textContent=p.en;
  renderList(); refreshFocusables();
  speak(p.text,currentLang().speech);
}
function moveFocus(d){
  if(!focusables.length) return;
  focusPos=((focusPos+d)%focusables.length+focusables.length)%focusables.length;
  focusables[focusPos].focus();
}
document.addEventListener("keydown",function(e){
  if(e.key==="ArrowRight"){ e.preventDefault(); moveFocus(1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); moveFocus(-1); }
  else if(e.key==="ArrowDown"){ e.preventDefault(); moveFocus(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); moveFocus(-1); }
});
document.addEventListener("focusin",function(e){
  var i=focusables.indexOf(e.target);
  if(i>=0) focusPos=i;
});
try{ if("speechSynthesis" in window){ window.speechSynthesis.getVoices(); } }catch(e){}
renderTabs(); renderList(); refreshFocusables();
})();
</script>
</body>
</html>
